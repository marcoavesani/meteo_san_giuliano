name: Fetch forecasts

on:
  schedule:
    - cron: '47 14 * * *'   # UTC; off the top of the hour to reduce queueing delays
  workflow_dispatch:

concurrency:
  group: data-commit   # shared with fetch_measurements.yml
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch forecasts
        run: python get_and_upload_forecast_sangiuliano.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update forecasts $(date -u '+%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

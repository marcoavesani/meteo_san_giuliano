name: Fetch measurements

on:
  schedule:
    # The station page only shows *today* (local time): anything not saved before
    # midnight Europe/Rome is lost. Scheduled runs can be delayed by hours, so run
    # every hour (at an off-peak minute) and let the merge deduplicate.
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: data-commit   # shared with fetch_forecasts.yml: never push concurrently
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch measurements
        run: python get_and_upload_wind_data_sangiuliano.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/measurements
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update measurements $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
